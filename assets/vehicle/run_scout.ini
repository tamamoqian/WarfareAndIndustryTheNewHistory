[core]
name:run_scout
overrideAndReplace:scout
displayText:牧羊人
displayDescription:-多用途步兵战车 \n-透过迷雾看得更远 \n-发射排雷器 \n-只能攻击地面单位 \n-可搭载6个射击员
class:CustomUnitMetadata
price:800
maxHp:210
mass:3000
techLevel:1
buildSpeed:10.4s
radius:12
fogOfWarSightRange:22
maxTransportingUnits:6
transportUnitsRequireTag:Infantry,步兵,小兵,轻甲
isBio:false
softCollisionOnAll:0
tags:apc_tag
builtFrom_1_name: commandCenter
builtFrom_1_pos:  2
builtFrom_2_name: landFactory
builtFrom_2_pos:  1.1
transportUnitsCanUnloadUnits:if not self.isControlledByAI()
[action_Shielding]
autoTrigger:if numberOfUnitsInEnemyTeam(greaterThan=0,withTag='anti_radar',withinRange=800)
convertTo:run_scout_shielding
isVisible:false
[hiddenAction_nottransporrt]
autoTrigger:if self.transportingCount(greaterThan=5)
temporarilyRemoveTags:apc_tag
[hiddenAction_allowtransport]
autoTrigger:if self.transportingCount(lessThan=6)
temporarilyAddTags:apc_tag
[attachment_subcombat1]
x:5
y:5
isVisible:false
addTransportedUnits:true
createIncompleteIfParentIs:true
