[action_rust]
convertTo:commandCenter
text:铁锈自由联邦
description:向前推进，军歌嘹亮，与自由之师并肩携手。\n勇猛无畏，忠贞不渝，我们战无不胜！\n铁锈联邦是国际联盟的领导，其陆战轻装甲使用主战坦克、陆战重装甲使用机甲、空军使用直升机、海军以航母为主；其势力范围为地球西亚、中亚、东南亚、美洲、大洋洲、非洲、西欧
iconExtraImage:rust.png
unitShownInUI:commandCenter
displayType:Upgrade
buildSpeed:1
ai_isHighPriority:true
playSoundToPlayer:ROOT:res/raw/eun_select.ogg
spawnUnits:run_infantrys*12(gridAlign=true),builder*3(gridAlign=true)
[action_rustSoviet]
convertTo:base_core_T1
text:北方联合国
description:嘿白匪军就是一群黑乌鸦，想把我们踏在脚底下。\n红军战士迈开步向前进，响应号召我们去斗争。\n让革命的火燃烧在全世界，把大教堂监狱都毁灭。\n北方联合国是第二国际的领导，其陆战轻装甲使用漫游坦克、陆战重装甲使用护盾坦克、空军使用飞机、海军以导弹战舰为主，其势力范围为俄罗斯远东红军
iconExtraImage:rustSoviet.png
unitShownInUI:base_core_T1
displayType:Upgrade
buildSpeed:1
isVisible:true
ai_isHighPriority:true
playSoundToPlayer:ROOT:res/raw/nun_select.ogg
spawnUnits:sov_infantrys*12(gridAlign=true),sov_tank_builder*3(gridAlign=true)
removeGlobalTeamTags:cpc
[action_communistyeast]
convertTo:cpc_base
text:东亚人民解放阵线
description:向前！向前！向前！我们的队伍向太阳，脚踏着祖国的大地\n背负着斗争的希望，我们是一支不可战胜的力量。\n我们是工农的子弟兵，我们是人民的武装。\n东亚人民解放阵线是第二国际成员国，其陆战轻装甲使用悬浮坦克、陆战重装甲使用机甲；空军以炮艇为主、海军以潜艇为主，其势力范围为中国红军、日本红军、朝鲜人民军、越南人民军
isVisible:true
displayType:Upgrade
buildSpeed:1
iconExtraImage:communistyeast.png
unitShownInUI:cpc_base
ai_isHighPriority:true
playSoundToPlayer:ROOT:res/raw/cpc_select.ogg
spawnUnits:cpc_infantrys*12(gridAlign=true),sov_tank_builder*3(gridAlign=true)
addGlobalTeamTags:cpc
[action_green]
convertTo:ger_base
text:德意志绿地帝国
description:无论是狂风暴雪，或烈日当空，无论是炎热白昼，或冰冷黑夜\n即使沙尘扑面而来，我们心情依然愉快，依然愉快\n我们的坦克在疾驰，迎风暴而行。\n-初始单位：国防军x6 建造者x2 \n绿地帝国是轴心国的领导，其陆战轻装甲使用半履带车、陆战重装甲使用突击坦克、空军使用飞碟、海军使用潜艇；其势力范围为整个火星及地球国防军
iconExtraImage:green.png
unitShownInUI:ger_base
displayType:Upgrade
buildSpeed:1
spawnUnits:ger_infantrys*12(gridAlign=true),ger_builder*3(gridAlign=true)
ai_isHighPriority:true
playSoundToPlayer:ROOT:res/raw/ger_select.ogg
